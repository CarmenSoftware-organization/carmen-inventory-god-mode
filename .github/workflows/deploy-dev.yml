name: Deploy god-mode (Dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy หยุด service แล้ว build ทับ node_modules/.next เดิม สอง run พร้อมกัน
# จะเขียนทับกันกลางคัน — ต่อคิวแทน
concurrency:
  group: deploy-dev-god-mode
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: development

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          command_timeout: 30m
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:$PATH"
            DIR=/root/carmen-inventory-god-mode
            SVC=carmen-god-mode
            PORT=9903
            cd "$DIR"

            # .env ไม่อยู่ใน git (มี GOD_MODE_PASSWORD, SESSION_SECRET และ DB URL)
            # ถ้าหายต้องหยุดก่อน build — ไม่งั้น service จะ restart แล้วตายด้วย
            # zod validation error ที่ไม่ได้บอกว่าไฟล์หาย
            if [ ! -f .env ]; then
              echo "::error::ไม่พบ $DIR/.env — ไฟล์นี้ไม่อยู่ใน git ต้องวางไว้บนเครื่องเอง"
              exit 1
            fi

            echo "=== [1/4] Pull origin/main ==="
            # --ff-only ไม่ใช่ reset --hard: reset จะกลืน commit ที่ค้างบนเครื่อง
            # เงียบ ๆ และเคยลบ .env ของ micro-cronjobs ไปแล้วมาก่อน
            git fetch origin main
            git pull --ff-only origin main
            echo "now at $(git rev-parse --short HEAD) - $(git log -1 --pretty=%s)"

            echo "=== [2/4] Install ==="
            bun install --frozen-lockfile

            echo "=== [3/4] Build ==="
            # build ก่อน restart เสมอ — ถ้า build พังให้ service เดิมเสิร์ฟต่อ
            if ! bun run build; then
              echo "::error::BUILD FAILED — service ยังรันของเดิมอยู่ ไม่ได้ถูกแตะ"
              exit 1
            fi

            echo "=== [4/4] Restart + health ==="
            rc-service "$SVC" restart
            ok=""
            i=1
            while [ "$i" -le 20 ]; do
              code=$(wget -qS -O /dev/null "http://localhost:$PORT/login" 2>&1 | grep -m1 HTTP | awk '{print $2}')
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 1
              i=$((i + 1))
            done
            rc-service "$SVC" status || true
            if [ -z "$ok" ]; then
              echo "::error::/login ไม่ตอบ 200 ภายใน 20 วินาที — ดู /var/log/$SVC.log"
              tail -30 "/var/log/$SVC.log" || true
              exit 1
            fi
            echo "healthy: /login -> 200"
            echo "DONE OK"
